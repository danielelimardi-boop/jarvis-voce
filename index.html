<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis - Microfono</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#04111c;color:#d6f1ff;font:500 18px/1.45 system-ui,sans-serif;text-align:center}
main{padding:22px;max-width:380px}
h1{margin:0 0 8px;font-size:19px;letter-spacing:.1em;color:#3fd0ff}
button{margin:14px 0;padding:14px 26px;font:600 18px system-ui,sans-serif;color:#3fd0ff;background:rgba(63,208,255,.1);border:1px solid #3fd0ff;cursor:pointer}
button.on{color:#f2b632;border-color:#f2b632;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.55}}
#st{margin:0;color:#7aa3ba;font-size:15px}
#tr{min-height:3em;margin:0;color:#fff}
:focus-visible{outline:2px solid #f2b632;outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>MICROFONO DI JARVIS</h1>
  <p id="st">Prema «Avvia ascolto» una volta e parli, Signore: l'ascolto riprende da solo dopo ogni risposta. Prema «Termina ascolto» quando ha finito.</p>
  <button id="b" type="button">Avvia ascolto</button>
  <p id="tr" aria-live="polite"></p>
</main>
<script>
(function () {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var opener = window.opener, rec = null, gen = 0;
  var on = false, pausa = false, ascolto = false, tAttesa = null, tSicurezza = null;
  var b = document.getElementById('b'), st = document.getElementById('st'), tr = document.getElementById('tr');

  function dire(t) { st.textContent = t; }
  function invia(testo, finale) {
    if (opener) opener.postMessage({ jarvisVoce: true, finale: finale, testo: testo }, '*');
  }
  function azzera() { clearTimeout(tAttesa); clearTimeout(tSicurezza); }
  function metti(v) { ascolto = v; b.classList.toggle('on', v); }
  function ferma() { gen++; metti(false); if (rec) { try { rec.abort(); } catch (x) {} } }

  function avvia() {
    if (!SR) { dire('Questo browser non supporta il riconoscimento vocale: usi Chrome o Safari.'); on = false; return; }
    if (!on || pausa || ascolto) return;
    var mio = ++gen;
    if (rec) { try { rec.abort(); } catch (x) {} }
    rec = new SR();
    rec.lang = 'it-IT';
    rec.interimResults = true;
    rec.continuous = false;
    rec.onstart = function () { if (mio !== gen) return; metti(true); dire('In ascolto…'); };
    rec.onresult = function (e) {
      if (mio !== gen) return;
      var t = '';
      for (var i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript;
      tr.textContent = t;
      var fin = e.results[e.results.length - 1].isFinal;
      invia(t, fin);
      if (fin) {  // frase completa: attendo la risposta di Jarvis senza riascoltare
        pausa = true; azzera();
        tAttesa = setTimeout(riprendi, 3000); // se Jarvis non risponde, riprendo da solo
        dire('Jarvis sta rispondendo…');
      }
    };
    rec.onerror = function (e) {
      if (mio !== gen) return;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        on = false; metti(false); b.textContent = 'Avvia ascolto';
        dire('Accesso al microfono negato: lo consenta nelle impostazioni del browser e in Impostazioni di Sistema, Privacy e sicurezza, Microfono.');
      } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
        dire('Errore: ' + e.error);
      }
    };
    rec.onend = function () {
      if (mio !== gen) return;
      metti(false);
      if (on && !pausa) setTimeout(avvia, 300);
    };
    try { rec.start(); } catch (x) { metti(false); }
  }

  function riprendi() {
    azzera(); pausa = false;
    if (on && !ascolto) setTimeout(avvia, 300);
  }

  b.onclick = function () {
    if (on) {
      on = false; pausa = false; azzera(); ferma();
      b.textContent = 'Avvia ascolto'; dire('Ascolto terminato.');
    } else {
      on = true; pausa = false; azzera();
      b.textContent = 'Termina ascolto'; avvia();
    }
  };

  // Comandi da Jarvis: "pausa" mentre elabora e parla, "riprendi" quando ha finito
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.jarvisCmd) return;
    if (d.jarvisCmd === 'pausa') {
      pausa = true; azzera(); ferma();
      tSicurezza = setTimeout(riprendi, 120000);
      if (on) dire('Jarvis sta rispondendo…');
    }
    if (d.jarvisCmd === 'riprendi') riprendi();
  });
})();
</script>
</body>
</html>
